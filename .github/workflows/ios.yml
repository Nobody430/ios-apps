name: Build iOS apps

# Unsigned test build (for sideloading). Manual only – the TestFlight workflow already builds every change.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Vital
            dir: vital
          - app: Saldo
            dir: saldo
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          xcodebuild -project ${{ matrix.app }}.xcodeproj -scheme ${{ matrix.app }} -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ${{ matrix.dir }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/${{ matrix.app }}.app Payload/
          zip -qry ${{ matrix.app }}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ipa
          path: ${{ matrix.dir }}/${{ matrix.app }}.ipa
          retention-days: 30
