name: Saldo
options:
  bundleIdPrefix: com.nobody430
  deploymentTarget:
    iOS: "17.0"
targets:
  Saldo:
    type: application
    platform: iOS
    sources: [Saldo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobody430.saldo
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "CI com.nobody430.saldo"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Saldo/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saldo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Saldo wird mit Face ID gesperrt, um deine Finanzdaten zu schützen.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kontoauszug
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.xml, public.comma-separated-values-text, public.plain-text]
schemes:
  Saldo:
    build:
      targets:
        Saldo: all
    run:
      config: Debug
    archive:
      config: Release
