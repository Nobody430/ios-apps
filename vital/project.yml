name: Vital
options:
  bundleIdPrefix: com.nobody430
  deploymentTarget:
    iOS: "17.0"
targets:
  Vital:
    type: application
    platform: iOS
    sources: [Vital]
    entitlements:
      path: Vital/Vital.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobody430.vital
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "CI com.nobody430.vital"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Vital/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Vital
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Vital liest dein Gewicht aus Apple Health, um deinen Trend zu berechnen.
        NSHealthUpdateUsageDescription: Vital speichert Gewicht und Krafttrainings in Apple Health.
        NSCameraUsageDescription: Vital nutzt die Kamera, um Mahlzeiten zu fotografieren und Barcodes zu scannen.
        NSPhotoLibraryUsageDescription: Vital liest Fotos deiner Mahlzeiten, um Nährwerte zu schätzen.
        NSFaceIDUsageDescription: Vital kann mit Face ID gesperrt werden, um deine Gesundheitsdaten zu schützen.
schemes:
  Vital:
    build:
      targets:
        Vital: all
    run:
      config: Debug
    archive:
      config: Release
